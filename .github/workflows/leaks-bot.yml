name: Leaks to Discord (Fortnite, Minecraft, GTA)

# Keeps going with nobody's computer on: every run ends by queueing the next one, and that
# queued run first waits 10 minutes in the "every-10-min" environment (a wait timer, so no
# runner is held while it waits). The hourly cron is only a backup that restarts the chain.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "Queued by the previous run (waits 10 minutes first)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/**", "leaks.py"]

permissions:
  contents: write
  actions: write

jobs:
  wait:
    if: ${{ inputs.chained }}
    runs-on: ubuntu-latest
    environment: every-10-min
    steps:
      - run: echo "10 minutes since the last check"

  post:
    needs: wait
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency: leaks-post
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # a queued run's own commit is 10+ minutes old; start from the latest state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post new leaks and news
        run: python leaks.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_MINECRAFT: ${{ secrets.DISCORD_WEBHOOK_MINECRAFT }}
          DISCORD_WEBHOOK_GTA: ${{ secrets.DISCORD_WEBHOOK_GTA }}
      - name: Save what was posted
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "leaks-bot"
            git config user.email "leaks-bot@users.noreply.github.com"
            git add state.json
            git commit -q -m "leaks: remember posted items"
            git pull -q --rebase -X theirs && git push -q      # on a clash, this run's state wins
          fi
      - name: Queue the next run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # never chain without the wait timer, or runs would fire back to back
          wait=$(gh api "repos/$GITHUB_REPOSITORY/environments/every-10-min" \
                   --jq '[.protection_rules[]? | select(.type == "wait_timer") | .wait_timer][0] // 0' || echo 0)
          if [ "${wait:-0}" -lt 5 ]; then echo "no wait timer, leaving it to the cron"; exit 0; fi
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w leaks-bot.yml -L 20 --json databaseId,status \
                     --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"waiting\" or .status == \"queued\" or .status == \"pending\" or .status == \"requested\")] | length")
          if [ "${queued:-0}" -gt 0 ]; then echo "next run already queued"; exit 0; fi
          for i in 1 2 3; do
            gh workflow run leaks-bot.yml -R "$GITHUB_REPOSITORY" -f chained=true && exit 0
            sleep 15
          done
          exit 1
